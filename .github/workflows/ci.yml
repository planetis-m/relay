name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ github.token }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Run tests
        run: nim test tests/ci.nims

      # Enable after ubuntu-latest finishes its 24.04 -> 26.04 rollout
      # (October 19-November 19, 2026) to avoid mixed curl versions.
      # https://github.com/actions/runner-images/issues/14748
      # - name: Install Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #
      # - name: Run WebSocket wire tests
      #   run: sh tests/verify-websocket.sh

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ github.token }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Run tests (ASan)
        run: nim asan tests/ci.nims

  linux-tsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ github.token }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Run tests (TSan)
        run: nim tsan tests/ci.nims

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ github.token }}

      - name: Install dependencies
        run: brew install curl

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: nim test tests/ci.nims

      - name: Run WebSocket wire tests
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          sh tests/verify-websocket.sh

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ github.token }}

      - name: Install dependencies (vcpkg)
        uses: johnwason/vcpkg-action@v7
        with:
          pkgs: curl[http2,ssl,c-ares,websockets]
          triplet: x64-windows-release
          token: ${{ github.token }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg\installed\x64-windows-release
        run: |
          $env:PATH = "$env:VCPKG_ROOT\bin;" + $env:PATH
          nim test tests/ci.nims

      - name: Run WebSocket wire tests
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg\installed\x64-windows-release
        run: |
          export PATH="$(cygpath -u "$VCPKG_ROOT")/bin:$PATH"
          sh tests/verify-websocket.sh
